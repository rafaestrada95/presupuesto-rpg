<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://presupuesto-rpg-production.up.railway.app; worker-src 'self'; manifest-src 'self'; media-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'"/>
<meta name="referrer" content="no-referrer"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#F7F7F5"/>
<meta name="apple-mobile-web-app-title" content="Budgy"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<title>Budgy</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
/* Budgy — tokens (ver DESIGN.md). Los nombres viejos (--accent, --card…) se
   conservan para que los componentes existentes tomen la nueva paleta. */
:root{
  color-scheme:light;
  --indigo:#4F46E5;--emerald:#10B981;--coral:#FF6B5E;--mango:#FBBF24;--violet:#8B5CF6;--sky:#38BDF8;
  --bg:#F7F7F5;--surface:#EEEEEA;--card:#FFFFFF;--border:#E4E4DF;
  --accent:#4F46E5;--as:rgba(79,70,229,.10);--am:rgba(79,70,229,.28);--on-accent:#FFFFFF;
  --good:#047857;--gs:rgba(16,185,129,.14);
  --danger:#D92D20;--ds:rgba(217,45,32,.08);
  --warn:#9A6300;--ws:rgba(251,191,36,.20);
  --blue:#0369A1;--bs:rgba(56,189,248,.16);
  --purple:#6D28D9;--ps:rgba(139,92,246,.12);
  --orange:#C8453A;
  --text:#18212F;--muted:#6B7280;--dim:#4A5363;--faint:#E4E4DF;
  --fg-rgb:24,33,47;--bg-rgb:247,247,245;
  --font:'Manrope',ui-sans-serif,-apple-system,'Segoe UI',sans-serif;
  --r-s:8px;--r-b:12px;--r-c:16px;--r-l:22px;
  --fs:16px;--legacy-zoom:1.12;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --indigo:#6D66F0;
    --bg:#10141D;--surface:#222937;--card:#1A202C;--border:#2B3342;
    --accent:#8B85F7;--as:rgba(139,133,247,.16);--am:rgba(139,133,247,.35);
    --good:#34D399;--gs:rgba(16,185,129,.18);
    --danger:#FF7B72;--ds:rgba(255,123,114,.12);
    --warn:#FBBF24;--ws:rgba(251,191,36,.14);
    --blue:#7DD3FC;--bs:rgba(56,189,248,.14);
    --purple:#C4B1FF;--ps:rgba(139,92,246,.18);
    --orange:#FF8F84;
    --text:#EEF1F6;--muted:#98A1B2;--dim:#C3C9D4;--faint:#2B3342;
    --fg-rgb:238,241,246;--bg-rgb:16,20,29;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --indigo:#6D66F0;
  --bg:#10141D;--surface:#222937;--card:#1A202C;--border:#2B3342;
  --accent:#8B85F7;--as:rgba(139,133,247,.16);--am:rgba(139,133,247,.35);
  --good:#34D399;--gs:rgba(16,185,129,.18);
  --danger:#FF7B72;--ds:rgba(255,123,114,.12);
  --warn:#FBBF24;--ws:rgba(251,191,36,.14);
  --blue:#7DD3FC;--bs:rgba(56,189,248,.14);
  --purple:#C4B1FF;--ps:rgba(139,92,246,.18);
  --orange:#FF8F84;
  --text:#EEF1F6;--muted:#98A1B2;--dim:#C3C9D4;--faint:#2B3342;
  --fg-rgb:238,241,246;--bg-rgb:16,20,29;
}
/* Modo simple: misma identidad, más grande y con más contraste */
:root.simple{--fs:19px;--legacy-zoom:1.3;--muted:#4A5363;--border:#CFCFC8}
@media (prefers-color-scheme:dark){:root.simple:not([data-theme="light"]){--muted:#C3C9D4;--border:#3A4456}}
:root.simple[data-theme="dark"]{--muted:#C3C9D4;--border:#3A4456}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-tap-highlight-color:transparent}
#root{min-height:100vh}

/* ── PIN ── */
.pin-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px}
.pin-logo{font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--accent);margin-bottom:8px;text-align:center}
.pin-title{font-family:var(--font);font-size:24px;font-weight:800;margin-bottom:6px;text-align:center}
.pin-sub{font-size:13px;color:var(--muted);margin-bottom:32px;text-align:center;line-height:1.5;max-width:260px}
.pin-dots{display:flex;gap:14px;margin-bottom:10px}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);transition:all .2s}
.pin-dot.filled{background:var(--accent);border-color:var(--accent)}
.pin-dot.error{background:var(--danger);border-color:var(--danger)}
.pin-err{font-size:12px;color:var(--danger);height:18px;margin-bottom:18px;text-align:center}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:280px}
.pin-btn{height:64px;border-radius:16px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:var(--font);font-size:22px;font-weight:700;cursor:pointer;-webkit-appearance:none;display:flex;align-items:center;justify-content:center;transition:all .15s}
.pin-btn:active{background:var(--accent);color:#FFFFFF;transform:scale(.95)}
.pin-btn.clear{font-size:13px;font-family:var(--font);font-weight:600;color:var(--muted)}
.pin-btn.empty{background:transparent;border:none;cursor:default}
.pin-name-inp{width:100%;max-width:280px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 16px;color:var(--text);font-family:var(--font);font-size:15px;outline:none;margin-bottom:28px;text-align:center;-webkit-appearance:none}
.pin-name-inp:focus{border-color:var(--accent)}
.pin-name-inp::placeholder{color:var(--muted)}

/* ── ONBOARDING ── */
@keyframes obIn{0%{opacity:0;transform:translateX(30px)}100%{opacity:1;transform:none}}
@keyframes obOut{0%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-30px)}}
.ob-overlay{position:fixed;inset:0;z-index:8000;display:flex;flex-direction:column;overflow:hidden}
.ob-bg{position:absolute;inset:0}
.ob-content{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;padding:0}
.ob-step{flex:1;min-height:0;display:flex;flex-direction:column;padding:40px 24px 0;animation:obIn .35s ease}
.ob-step.leaving{animation:obOut .25s ease forwards}
.ob-header{margin-bottom:24px;flex-shrink:0}
.ob-icon{font-size:44px;margin-bottom:14px}
.ob-step-num{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:8px;opacity:.8}
.ob-title{font-family:var(--font);font-size:26px;font-weight:800;line-height:1.15;margin-bottom:8px}
.ob-sub{font-size:13px;color:var(--dim);line-height:1.6;max-width:300px}
.ob-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ob-footer{flex-shrink:0;padding:20px 24px 40px;display:flex;flex-direction:column;gap:10px}
.ob-progress{display:flex;gap:6px;justify-content:center;margin-bottom:4px}
.ob-dot{width:6px;height:6px;border-radius:50%;background:rgba(var(--fg-rgb),.2);transition:all .3s}
.ob-dot.active{background:var(--accent);width:18px;border-radius:3px}
.ob-dot.done{background:var(--accent);opacity:.5}
.ob-btn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--accent);color:#FFFFFF;font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;-webkit-appearance:none;transition:all .15s}
.ob-btn:active{transform:scale(.98)}
.ob-skip{font-size:12px;color:var(--muted);text-align:center;cursor:pointer;padding:4px}
.ob-expense-row{display:flex;gap:8px;margin-bottom:10px}
.ob-quick-debt{padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:10px}

/* ── APP ── */
.app{max-width:480px;margin:0 auto;padding:16px 13px 90px}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.eye{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.h1{font-family:var(--font);font-size:clamp(18px,4vw,24px);font-weight:800}
.hdr-sub{color:var(--muted);font-size:11px;margin-top:2px}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.save-pill{display:flex;align-items:center;gap:5px;font-size:10px;padding:3px 9px;border-radius:99px}
.save-dot{width:6px;height:6px;border-radius:50%}
.lock-btn{font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px 10px;cursor:pointer;-webkit-appearance:none}
.tabs{display:flex;gap:2px;background:var(--surface);border-radius:12px;padding:3px;margin-bottom:12px;border:1px solid var(--border)}
.tab{flex:1;padding:8px 1px;border-radius:9px;border:none;background:transparent;color:var(--muted);font-family:var(--font);font-size:10px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center;-webkit-appearance:none}
.tab.on{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.6)}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.ct{font-family:var(--font);font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:11px;display:flex;align-items:center;gap:5px}

/* ── HERO CARD ── */
.hero-card{border-radius:20px;margin-bottom:10px;overflow:hidden;position:relative;border:2px solid}
.world-scene{width:100%;height:155px;display:block}
.hero-aura{position:absolute;top:0;right:0;width:150px;height:150px;border-radius:50%;opacity:.12;filter:blur(35px);pointer-events:none}
.hero-bottom{padding:14px}
.hero-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.hero-name{font-family:var(--font);font-size:17px;font-weight:800;line-height:1.1;margin-bottom:1px}
.hero-title{font-size:11px;font-weight:600;opacity:.8;margin-bottom:5px}
.hero-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:1px;text-transform:uppercase;border:1px solid}
.xp-bar-bg{height:10px;background:rgba(var(--fg-rgb),.08);border-radius:99px;overflow:hidden;margin-bottom:4px}
.xp-bar-fill{height:100%;border-radius:99px;transition:width 1s cubic-bezier(.34,1.56,.64,1)}
.xp-labels{display:flex;justify-content:space-between;font-size:10px;opacity:.6;margin-bottom:10px}
.streak-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px;background:rgba(217,119,6,.15);border:1px solid rgba(217,119,6,.3);color:var(--warn)}

/* ── LEVEL UP ── */
@keyframes luIn{0%{opacity:0;transform:scale(.3)}60%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes luOut{0%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes luGlow{0%,100%{box-shadow:0 0 40px var(--lu-c,#059669)}50%{box-shadow:0 0 80px var(--lu-c,#059669)}}
.lu-overlay{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(var(--bg-rgb),.97);padding:30px}
.lu-overlay.in{animation:luIn .6s cubic-bezier(.34,1.56,.64,1) forwards}
.lu-overlay.out{animation:luOut .4s ease forwards;pointer-events:none}
.lu-confetti{position:absolute;width:10px;height:10px;border-radius:2px;animation:confettiFall 2.5s ease-in forwards}
.lu-ring{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:20px;position:relative;border:4px solid;animation:luGlow 1.5s ease infinite}
@keyframes ringPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.05)}}
.lu-ring-inner{position:absolute;inset:-10px;border-radius:50%;border:2px solid;animation:ringPulse 1s ease infinite;pointer-events:none}
.lu-badge{font-size:11px;font-weight:700;letter-spacing:4px;text-transform:uppercase;margin-bottom:6px;opacity:.8}
.lu-level{font-family:var(--font);font-size:56px;font-weight:800;line-height:1;margin-bottom:4px}
.lu-title{font-family:var(--font);font-size:24px;font-weight:800;margin-bottom:10px;text-align:center;line-height:1.2}
.lu-story{font-size:13px;max-width:260px;text-align:center;line-height:1.6;color:var(--dim);margin-bottom:28px}
.lu-actions{display:flex;gap:10px;width:100%;max-width:300px}
.lu-tap{flex:1;font-size:13px;color:var(--muted);border:1px solid var(--border);border-radius:99px;padding:12px 24px;cursor:pointer;background:transparent;font-family:var(--font);font-weight:600;-webkit-appearance:none}
.lu-share{flex:0 0 auto;font-size:13px;color:var(--accent);border:1px solid rgba(5,150,105,.3);border-radius:99px;padding:12px 16px;cursor:pointer;background:rgba(5,150,105,.1);font-family:var(--font);font-weight:600;-webkit-appearance:none}

/* ── PLAN PROGRESS ── */
.plan-card{border-radius:16px;padding:14px;margin-bottom:10px;border:2px solid}
.plan-dots{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.plan-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;transition:all .3s;flex-shrink:0}
.plan-dot.paid{background:var(--accent);color:#FFFFFF}
.plan-dot.current{background:var(--mango);color:#18212F;animation:pillPulse 1.5s ease infinite}
.plan-dot.pending{background:var(--border);color:var(--muted)}
.plan-mark-btn{width:100%;padding:11px;border-radius:10px;border:none;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:700;-webkit-appearance:none;margin-top:10px;transition:all .2s}
@keyframes payBurst{0%{transform:scale(1)}30%{transform:scale(1.15)}60%{transform:scale(.95)}100%{transform:scale(1)}}
.plan-mark-btn:active{animation:payBurst .4s ease}

/* ── CASH FLOW ── */
.cf-card{border-radius:14px;padding:14px;margin-bottom:10px;background:var(--card);border:1px solid var(--border)}
.cf-months{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.cf-month{background:var(--surface);border-radius:12px;padding:11px;text-align:center;border:1px solid var(--border)}
.cf-month.good{border-color:rgba(5,150,105,.3);background:rgba(5,150,105,.06)}
.cf-month.ok{border-color:rgba(2,132,199,.25);background:rgba(2,132,199,.05)}
.cf-month.warn{border-color:rgba(217,119,6,.3);background:rgba(217,119,6,.06)}
.cf-month.danger{border-color:rgba(217,45,32,.35);background:rgba(217,45,32,.08)}
.cf-month-name{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:6px}
.cf-bar-wrap{height:50px;display:flex;align-items:flex-end;justify-content:center;gap:4px;margin-bottom:6px}
.cf-bar{border-radius:3px 3px 0 0;min-height:4px;transition:height .4s}
.cf-net{font-family:var(--font);font-size:13px;font-weight:800}
.cf-net-label{font-size:9px;color:var(--muted);margin-top:2px}
.cf-status{font-size:14px;margin-bottom:2px}

/* ── COUNTDOWN ── */
.cd-rail{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.cd-rail::-webkit-scrollbar{display:none}
.cd-pill{flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:11px 13px;min-width:92px;text-align:center}
.cd-pill.urgent{border-color:rgba(217,45,32,.5);background:var(--ds)}
.cd-pill.warn{border-color:rgba(217,119,6,.4);background:var(--ws)}
@keyframes pillPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.cd-pill.urgent{animation:pillPulse 1.5s ease infinite}
.cd-num{font-family:var(--font);font-size:26px;font-weight:800;line-height:1}

/* ── MISSIONS ── */
.mission-card{border-radius:14px;padding:14px;margin-bottom:10px;background:var(--card);border:1px solid var(--border)}
.mission-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.mission-row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--surface);border-radius:11px;margin-bottom:7px;border:1px solid var(--border);transition:all .3s}
.mission-row.done{border-color:rgba(5,150,105,.3);background:rgba(5,150,105,.06)}
.mission-row:last-child{margin-bottom:0}
.mission-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;transition:all .3s}
.mission-row.done .mission-check{background:var(--accent);border-color:var(--accent)}
.mission-name{font-size:13px;font-weight:600;flex:1}
.mission-row.done .mission-name{text-decoration:line-through;opacity:.55}
.mission-desc{font-size:10px;color:var(--muted);margin-top:1px}
.mission-xp{font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px;flex-shrink:0}
.mission-row.done .mission-xp{background:var(--as);color:var(--accent)}
.mission-row:not(.done) .mission-xp{background:var(--ws);color:var(--warn)}

/* ── SUGGESTION ── */
.suggestion-card{border-radius:14px;padding:14px;margin-bottom:10px;background:linear-gradient(135deg,rgba(5,150,105,.07),rgba(2,132,199,.05));border:1px solid rgba(5,150,105,.22)}
.suggestion-row{display:flex;align-items:flex-start;gap:10px;padding:9px;background:rgba(var(--fg-rgb),.05);border-radius:10px;margin-bottom:7px}
.suggestion-row:last-child{margin-bottom:0}

/* ── NIGHT/STREAK ── */
.night-card{background:linear-gradient(135deg,rgba(124,58,237,.1),rgba(2,132,199,.08));border:1px solid rgba(124,58,237,.3);border-radius:16px;padding:14px;margin-bottom:10px}
.night-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.night-stat{background:rgba(var(--fg-rgb),.05);border-radius:10px;padding:10px;text-align:center}
.night-stat-n{font-family:var(--font);font-size:20px;font-weight:800}
.night-stat-l{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-top:2px}
@keyframes warnShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.streak-warn{background:var(--ds);border:1px solid rgba(217,45,32,.35);border-radius:14px;padding:13px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.streak-warn-icon{font-size:30px;animation:warnShake 1s ease infinite}

/* ── CHEST ── */
@keyframes chestBounce{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-8px) rotate(-4deg)}70%{transform:translateY(-4px) rotate(3deg)}}
@keyframes chestGlow{0%,100%{box-shadow:0 0 18px rgba(217,119,6,.3)}50%{box-shadow:0 0 36px rgba(217,119,6,.7)}}
.chest-card{border-radius:18px;padding:18px;margin-bottom:10px;background:linear-gradient(135deg,rgba(217,119,6,.12),rgba(226,87,74,.08));border:2px solid rgba(217,119,6,.4);animation:chestGlow 2s ease infinite;cursor:pointer;text-align:center}
.chest-emoji{font-size:50px;display:block;margin-bottom:8px;animation:chestBounce 1.5s ease infinite}

/* ── BRIEFING ── */
.briefing{border-radius:18px;padding:16px;margin-bottom:12px;border:2px solid}
.briefing-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px}
.briefing-stat{background:rgba(var(--fg-rgb),.05);border-radius:10px;padding:10px;text-align:center}

/* ── DAILY ── */
.daily-main{border-radius:14px;padding:14px;margin-bottom:10px}
.daily-big-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;opacity:.8}
.daily-big-amt{font-family:var(--font);font-size:36px;font-weight:800;line-height:1;margin-bottom:3px}
.daily-big-sub{font-size:11px;opacity:.7;margin-bottom:10px}
.daily-breakdown{background:rgba(var(--fg-rgb),.05);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px}
.db-row{display:flex;justify-content:space-between;font-size:11px}
.db-label{color:var(--muted)}
.db-val{font-family:var(--font);font-weight:700}
.db-div{height:1px;background:rgba(var(--fg-rgb),.07);margin:2px 0}

/* ── LOGGER ── */
.method-toggle{display:flex;gap:6px;margin-bottom:10px}
.method-btn{flex:1;padding:9px 6px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;text-align:center;-webkit-appearance:none;transition:all .2s}
.method-btn.on-cash{border-color:var(--accent);background:var(--as);color:var(--accent)}
.method-btn.on-card{border-color:var(--orange);background:rgba(226,87,74,.12);color:var(--orange)}
.log-row{display:flex;gap:6px;margin-bottom:8px}
.log-list{display:flex;flex-direction:column;gap:4px;max-height:160px;overflow-y:auto}
.log-item{display:flex;align-items:center;gap:6px;font-size:12px;padding:6px 8px;background:var(--surface);border-radius:8px;border:1px solid var(--border)}
.log-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;flex-shrink:0}
.batch-toggle{font-size:11px;color:var(--muted);text-align:center;padding:8px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* ── DEBT ── */
.pri-card{border-radius:12px;padding:11px;border:1px solid transparent;margin-bottom:7px}
.pri-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.pri-ico{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;font-weight:800;font-family:var(--font)}
.pri-name{font-weight:700;font-size:13px;font-family:var(--font);line-height:1.2}
.pri-meta{font-size:10px;margin-top:2px;color:var(--dim)}
.pri-bal{font-family:var(--font);font-size:14px;font-weight:800;margin-left:auto;flex-shrink:0}
.pri-foot{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.urg-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;display:inline-flex;align-items:center;gap:3px}
.pay-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;margin-left:auto;flex-shrink:0;background:var(--bs);color:var(--blue)}

/* ── SHARED ── */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}
.fg-full{grid-column:1/-1}
.ff{display:flex;flex-direction:column;gap:3px}
.fl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.inp{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 10px;color:var(--text);font-family:var(--font);font-size:15px;outline:none;transition:border-color .2s;-webkit-appearance:none}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:var(--muted)}
.sel{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px;color:var(--text);font-family:var(--font);font-size:14px;outline:none;-webkit-appearance:none}
.btn-g{display:block;width:100%;padding:12px;border-radius:9px;border:none;background:var(--accent);color:#FFFFFF;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;-webkit-appearance:none}
.btn-sm{padding:10px 14px;border-radius:8px;border:none;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;background:var(--accent);color:#FFFFFF;flex-shrink:0;-webkit-appearance:none}
.btn-x{background:var(--ds);color:var(--danger);border:1px solid transparent;border-radius:7px;padding:5px 8px;font-size:11px;cursor:pointer;font-weight:600;flex-shrink:0;-webkit-appearance:none}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.type-btn{padding:9px 8px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font);font-size:11px;font-weight:600;cursor:pointer;text-align:left;line-height:1.4;-webkit-appearance:none;transition:all .2s}
.type-btn .td{font-size:9px;font-weight:400;opacity:.7;margin-top:2px}
.type-btn.on{border-color:var(--accent);background:var(--as);color:var(--text)}
.exp-row{display:flex;align-items:center;gap:8px;padding:9px 10px;background:var(--surface);border:1px solid var(--border);border-radius:11px;margin-bottom:7px}
.exp-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.qbadge{font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;display:inline-block;margin-top:2px}
.upc-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.upc-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.upc-days{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;margin-left:4px;flex-shrink:0}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px}
.chip-l{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:2px}
.chip-v{font-family:var(--font);font-size:15px;font-weight:700}
.q-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.q-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.q-lbl{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.q-inp{width:100%;background:transparent;border:none;color:var(--text);font-family:var(--font);font-size:22px;font-weight:800;outline:none;-webkit-appearance:none}
.q-inp::placeholder{color:var(--muted);opacity:.55}
.al{border-radius:11px;padding:9px 11px;font-size:12px;margin-bottom:9px;display:flex;gap:7px;line-height:1.6}
.al-r{background:var(--ds);border:1px solid rgba(217,45,32,.25);color:var(--danger)}
.al-y{background:var(--ws);border:1px solid rgba(217,119,6,.25);color:var(--warn)}
.al-g{background:var(--as);border:1px solid var(--am);color:var(--accent)}
.al-b{background:var(--bs);border:1px solid rgba(2,132,199,.25);color:var(--blue)}
.pbar{height:5px;background:var(--surface);border-radius:99px;overflow:hidden;margin-top:5px}
.pbar-f{height:100%;border-radius:99px;transition:width .4s}
.sec{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:12px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.empty{text-align:center;padding:20px 0;color:var(--muted);font-size:12px}
.total-row{display:flex;justify-content:space-between;font-size:12px;padding-top:8px;border-top:1px solid var(--border);margin-top:4px}
.emer-card{background:var(--ps);border:1px solid rgba(124,58,237,.2);border-radius:14px;padding:14px;margin-bottom:10px}
.sem{display:flex;flex-direction:column;align-items:center;padding:12px 0 8px;text-align:center}
.sem-ring{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:7px;position:relative}
.sem-inner{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;border:3px solid}
.sem-label{font-family:var(--font);font-size:14px;font-weight:800;margin-bottom:2px}
.sem-sub{font-size:11px;color:var(--muted);max-width:210px;line-height:1.5}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes xpfloat{0%{opacity:1;transform:translateY(0) scale(1.2)}100%{opacity:0;transform:translateY(-55px) scale(.8)}}
.xp-notif{position:fixed;font-family:var(--font);font-weight:800;font-size:20px;pointer-events:none;z-index:9990;animation:xpfloat 1.8s ease-out forwards;text-shadow:0 0 20px currentColor}
.mvl-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}
.mvl-item{background:var(--surface);border-radius:11px;padding:9px;text-align:center}
.cc-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:13px;margin-bottom:9px}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.cc-name{font-family:var(--font);font-size:14px;font-weight:700}
.cc-limit{font-size:11px;color:var(--muted);margin-top:2px}
.cc-bar-bg{height:7px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:8px}
.cc-bar-fill{height:100%;border-radius:99px;transition:width .4s}
.cc-tag{font-size:10px;font-weight:600;padding:3px 8px;border-radius:6px;display:inline-block;margin-right:4px}
.cc-tx{display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-bottom:1px solid var(--faint)}
.cc-tx:last-child{border-bottom:none}

*{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;-webkit-appearance:none}
input,select{-webkit-appearance:none}
#root{display:none}
#ps{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;background:var(--bg,#07090f)}
.pd{width:16px;height:16px;border-radius:50%;border:2px solid #1d2e47;background:transparent;transition:all .2s}
.pd.on{background:#059669;border-color:#059669}
.pd.er{background:#D92D20;border-color:#D92D20}
.pb{height:64px;border-radius:16px;border:1px solid #1d2e47;background:#141d2e;color:#dce8f8;font-family:var(--font);font-size:22px;font-weight:700;display:block;width:100%;outline:none;user-select:none;-webkit-user-select:none}
.pb:active{background:#059669!important;color:#FFFFFF!important}


/* PIN · Budgy */
#ps{background:var(--bg)!important;color:var(--text);font-family:var(--font)}
.b-logo{width:64px;height:64px;border-radius:20px;background:var(--indigo);color:#fff;display:grid;place-items:center;font-weight:800;font-size:34px;margin-bottom:14px;font-family:var(--font)}
.b-pin-brand{font-size:13px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.b-pin-title{font-size:26px;font-weight:800;margin-bottom:6px;text-align:center;letter-spacing:-.02em}
.b-pin-sub{font-size:15px;color:var(--dim);margin-bottom:24px;text-align:center;line-height:1.5;max-width:280px}
.b-pin-err{font-size:14px;color:var(--danger);height:20px;margin-bottom:18px;text-align:center;font-weight:600}
#pn{background:var(--card)!important;border:1px solid var(--border)!important;color:var(--text)!important;font-family:var(--font)!important;font-size:16px!important}
.pd{border-color:var(--border)!important}
.pd.on{background:var(--indigo)!important;border-color:var(--indigo)!important}
.pd.er{background:var(--danger)!important;border-color:var(--danger)!important}
.pb{background:var(--card)!important;border:1px solid var(--border)!important;color:var(--text)!important;font-family:var(--font)!important;border-radius:14px!important}
.pb:active{background:var(--indigo)!important;color:#fff!important}
.pb:disabled{background:transparent!important;border:none!important}

/* ════════ BUDGY UI ════════ */
html{font-size:var(--fs)}
html,body{font-family:var(--font);-webkit-font-smoothing:antialiased}
.b-app{max-width:480px;margin:0 auto;padding:max(12px,env(safe-area-inset-top,0px)) 20px calc(120px + env(safe-area-inset-bottom,0px));font-size:1rem;line-height:1.45;color:var(--text)}
.b-app>*+*{margin-top:28px}
:where(.b-app) button:where(:not(.b-legacy *)){font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left}
.b-app button:focus-visible,.b-sheet button:focus-visible,.b-nav button:focus-visible,.b-more summary:focus-visible{outline:3px solid var(--indigo);outline-offset:2px;border-radius:var(--r-s)}
.b-num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.b-i{width:24px;height:24px;flex:none}

.b-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.b-greet{font-size:.95rem;font-weight:500;color:var(--dim)}
.b-title{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0}
.b-app .b-avatar{width:44px;height:44px;border-radius:50%;background:var(--indigo);color:#fff;font-weight:800;display:grid;place-items:center;text-align:center;flex:none}
.b-avatar.lg{width:56px;height:56px;font-size:1.3rem;border-radius:50%;background:var(--indigo);color:#fff;font-weight:800;display:grid;place-items:center}
.b-app .b-back{display:flex;align-items:center;gap:4px;font-weight:600;color:var(--accent);min-height:44px}
.b-me{display:flex;align-items:center;gap:14px}

.b-hero .b-amount{font-size:3.4rem;font-weight:800;line-height:1;letter-spacing:-.04em}
.b-amount small{font-size:.5em;font-weight:700;vertical-align:.55em;margin-right:2px}
.b-amount.neg{color:var(--danger)}
.b-amount.sm{font-size:2.5rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.b-cap{font-size:1rem;font-weight:500;color:var(--dim);margin-top:6px}
.b-daily{display:flex;align-items:center;gap:8px;margin-top:14px;font-weight:600}
.b-daily b{font-weight:800}
.b-used{margin-top:18px}
.b-used-l{display:flex;justify-content:space-between;gap:10px;font-size:.86rem;color:var(--dim);margin-top:8px;font-weight:500}
.b-track{display:block;height:10px;border-radius:99px;background:var(--surface);overflow:hidden}
.b-track>i{display:block;height:100%;border-radius:99px;background:var(--indigo)}
.b-track.sm{height:6px}
.b-empty-t{font-size:1.4rem;font-weight:800;letter-spacing:-.02em}
.b-split{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:.88rem;color:var(--muted)}
.b-split b{color:var(--text)}
.b-hero .b-more{margin-top:14px}

.b-app .b-primary,.b-sheet .b-primary{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:var(--r-b);background:var(--indigo);color:#fff;font-weight:700;font-size:1.05rem;text-align:center}
.b-app .b-secondary{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:var(--r-b);background:var(--surface);font-weight:600;font-size:.9rem;white-space:nowrap;text-align:center}
.b-textbtn{color:var(--accent)!important;font-weight:600;font-size:.92rem;min-height:44px;display:inline-flex;align-items:center;white-space:nowrap}
.b-note{color:var(--dim);font-size:.92rem;margin:10px 0 0}
.b-note.warn{color:var(--warn);font-weight:600}

.b-sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.b-sh h2{font-size:1.1rem;font-weight:700;margin:0;letter-spacing:-.01em}

.b-rows>div,.b-rows>button{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);width:100%}
.b-rows>:last-child{border-bottom:0}
.b-m{flex:1;min-width:0}
.b-n{font-weight:600}
.b-d{font-size:.86rem;color:var(--muted)}
.b-soon{color:var(--warn);font-weight:700}
.b-late{color:var(--danger);font-weight:700}
.b-calm{display:flex;align-items:center;gap:10px;color:var(--good);font-weight:600}

.b-cat-ic{width:42px;height:42px;border-radius:var(--r-b);display:grid;place-items:center;flex:none}
.b-cat-ic .b-i{width:22px;height:22px}
.b-cat-ic.big{width:52px;height:52px;border-radius:14px}
.b-cat-ic.big .b-i{width:26px;height:26px}

.b-strip{display:grid;grid-template-columns:repeat(3,1fr)}
.b-strip>div{padding:2px 12px}
.b-strip>div:first-child{padding-left:0}
.b-strip>div+div{border-left:1px solid var(--border)}
.b-strip .k{font-size:.8rem;color:var(--muted);font-weight:600}
.b-strip .v{font-size:1.2rem;font-weight:800;margin-top:2px}
.b-strip .v small{font-size:.7em}
.b-strip .s{font-size:.74rem;color:var(--muted)}

.b-event{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--gs);border-radius:var(--r-c);padding:14px 16px}
.b-event div{font-size:.9rem;color:var(--dim)}
.b-event b{display:block;color:var(--text);font-size:1rem}

.b-app .b-game{display:block;width:100%;background:var(--violet);color:#fff;border-radius:var(--r-l);padding:20px}
.b-game-lv{display:flex;justify-content:space-between;align-items:center;gap:10px}
.b-game-n{font-weight:800;font-size:1.08rem}
.b-game-xp{font-size:.86rem;font-weight:700;opacity:.92;white-space:nowrap}
.b-game-t{height:8px;background:rgba(255,255,255,.28);border-radius:99px;margin-top:10px;overflow:hidden}
.b-game-t>i{display:block;height:100%;background:var(--mango);border-radius:99px}
.b-game-stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-weight:700;font-size:.92rem}
.b-game-ch{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.25);font-size:.9rem;display:flex;flex-direction:column;gap:2px}
.b-game-ch span{opacity:.9}
.b-app .b-game.slim{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-radius:var(--r-c)}

.b-app .b-insight{display:flex;gap:14px;align-items:flex-start;width:100%;background:var(--bs);border-radius:var(--r-c);padding:16px}
.b-insight-t{display:block;font-weight:600;font-size:.94rem}
.b-insight-go{display:block;color:var(--blue);font-weight:700;font-size:.88rem;margin-top:6px}

.b-more{border-top:1px solid var(--border)}
.b-more+.b-more{border-top:1px solid var(--border)}
section>.b-more:last-child{border-bottom:1px solid var(--border)}
.b-hero .b-more{border-bottom:0!important}
.b-more summary{list-style:none;cursor:pointer;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.b-hero .b-more summary{min-height:48px;font-size:.92rem;color:var(--accent);font-weight:600}
.b-more summary::-webkit-details-marker{display:none}
.b-more summary::after{content:"";width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);margin-right:4px;transition:transform .2s;flex:none}
.b-more[open] summary::after{transform:rotate(-135deg)}
.b-more-body{padding-bottom:16px}
.b-breakdown{display:flex;flex-direction:column}
.b-kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:.92rem;color:var(--dim)}
.b-kv:last-child{border-bottom:0}
.b-kv.strong{color:var(--text);font-weight:800}

.b-plan{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:3px;margin-top:8px}
.b-plan i{display:block;height:100%}
.b-legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.b-legend div{font-size:.8rem;color:var(--muted);font-weight:600}
.b-legend b{display:block;color:var(--text);font-size:1.05rem;font-weight:800}
.b-legend span{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.b-bar-row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.b-bar-row:last-child{border-bottom:0}
.b-bar-k{display:flex;align-items:center;gap:12px;font-weight:600}
.b-bar-v{font-weight:700}
.b-bar-row .b-track{grid-column:1/-1}

.b-goal{border-radius:var(--r-l);padding:20px;background:var(--emerald);color:#0B2A20}
.b-goal.empty{background:var(--gs);color:var(--text)}
.b-goal .k{font-size:.88rem;font-weight:700}
.b-goal .v{font-size:2.2rem;font-weight:800;line-height:1.1;margin-top:4px;letter-spacing:-.03em}
.b-goal .v small{font-size:.5em;vertical-align:.55em}
.b-goal .of{font-size:.5em;font-weight:700;opacity:.85;letter-spacing:0}
.b-goal .s{font-size:.9rem;margin-top:8px}
.b-goal-t{height:8px;background:rgba(11,42,32,.18);border-radius:99px;margin-top:14px;overflow:hidden}
.b-goal-t>i{display:block;height:100%;background:#0B2A20;border-radius:99px}
.b-app .b-goal-btn{margin-top:14px;min-height:44px;padding:0 16px;border-radius:var(--r-b);background:rgba(11,42,32,.12);font-weight:700;font-size:.9rem}
.b-goal.empty .b-goal-btn{background:var(--emerald);color:#0B2A20}
.b-debt-sum{display:flex;flex-direction:column;gap:2px}

.b-set{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--border)}
.b-set.col{display:block}
.b-set:last-child{border-bottom:0}
.b-set .t{font-weight:700}
.b-set .s{font-size:.86rem;color:var(--muted)}
.b-app .b-sw{width:54px;height:32px;border-radius:99px;background:var(--surface);position:relative;flex:none;border:1px solid var(--border)}
.b-sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.b-app .b-sw[aria-checked="true"]{background:var(--indigo);border-color:var(--indigo)}
.b-sw[aria-checked="true"]::after{transform:translateX(22px)}
.b-sw:disabled{opacity:.45}
.b-seg3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:var(--r-b);padding:4px;gap:4px;margin-top:10px}
.b-app .b-seg3 button{min-height:42px;border-radius:var(--r-s);font-weight:600;font-size:.88rem;text-align:center}
.b-app .b-seg3 button.on{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.b-steps{margin:10px 0 0;padding-left:1.2rem;display:flex;flex-direction:column;gap:6px;font-size:.92rem;color:var(--dim)}
.b-steps code{font-size:.85em;background:var(--surface);padding:1px 5px;border-radius:6px}
.b-steps code.b-url{display:block;word-break:break-all;padding:8px 10px;user-select:all}

/* Componentes existentes dentro de las pantallas nuevas */
.b-legacy{zoom:var(--legacy-zoom)}
.b-legacy .card,.b-legacy .cc-card,.b-legacy .cf-card,.b-legacy .mission-card{border-radius:var(--r-c)}

/* Barra inferior */
.b-nav{position:fixed;left:0;right:0;bottom:0;z-index:500;background:rgba(var(--bg-rgb),.94);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid var(--border);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.b-nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1.1fr 1fr 1fr;align-items:end}
.b-nav button{font-family:var(--font);background:none;border:0;padding:0;color:var(--muted)}
.b-tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0!important;min-height:56px;font-size:.72rem;font-weight:600}
.b-tab.on{color:var(--accent)!important}
.b-fab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:700;color:var(--text)!important;padding-bottom:6px!important}
.b-fab-b{width:60px;height:60px;border-radius:18px;background:var(--indigo);color:#fff;display:grid;place-items:center;margin-top:-24px;box-shadow:0 8px 20px rgba(79,70,229,.35)}
.b-fab-b .b-i{width:30px;height:30px}
:root.simple .b-tab,:root.simple .b-fab{font-size:.78rem}

/* Hoja para anotar */
.b-scrim{position:fixed;inset:0;background:rgba(16,20,29,.5);z-index:900}
.b-sheet{position:fixed;left:0;right:0;bottom:0;z-index:901;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 20px calc(16px + env(safe-area-inset-bottom,0px));max-height:94vh;overflow:auto;color:var(--text);font-family:var(--font)}
:where(.b-sheet) button{font:inherit;color:inherit;background:none;border:0;padding:0}
.b-sheet-in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.b-grab{width:40px;height:5px;border-radius:9px;background:var(--border);margin:0 auto}
.b-sheet-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:1.1rem}
.b-amt{text-align:center}
.b-amt-v{font-size:3.2rem;font-weight:800;line-height:1.05;letter-spacing:-.04em}
.b-amt-v small{font-size:.5em;vertical-align:.55em}
.b-amt-v.empty{color:var(--muted)}
.b-amt-h{font-size:.92rem;color:var(--dim);font-weight:500}
.b-heard{text-align:center;font-size:.95rem;font-style:italic;color:var(--dim)}
.b-heard.err{font-style:normal;color:var(--warn);font-weight:600}
.b-paywith,.b-cardpick{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.b-sheet .b-paywith button,.b-sheet .b-cardpick button{min-height:42px;font-weight:600;font-size:.92rem;color:var(--muted);border-bottom:3px solid transparent}
.b-sheet .b-paywith button.on,.b-sheet .b-cardpick button.on{color:var(--text);border-color:var(--indigo)}
.b-cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.b-sheet .b-cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px;border-radius:var(--r-b);font-size:.8rem;font-weight:600}
.b-sheet .b-cat:disabled{opacity:.4}
.b-sheet .b-cat.sel{background:var(--as)}
.b-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.b-sheet .b-key{min-height:54px;border-radius:var(--r-b);background:var(--card);border:1px solid var(--border);font-weight:700;font-size:1.4rem;font-variant-numeric:tabular-nums}
.b-sheet .b-voice{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:var(--r-b);font-weight:700;color:var(--accent);background:var(--as)}
.b-voice.live .b-i{animation:bPulse 1s ease-in-out infinite}
@keyframes bPulse{50%{transform:scale(1.25)}}

.b-toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:950;background:var(--text);color:var(--bg);border-radius:var(--r-c);padding:12px 12px 12px 16px;display:flex;gap:12px;align-items:center;width:min(440px,calc(100% - 40px));box-shadow:0 10px 30px rgba(0,0,0,.25);font-family:var(--font);font-weight:600;font-size:.92rem}
.b-toast span{flex:1}
.b-toast button{background:none;border:0;color:var(--bg);font:inherit;font-weight:800;text-decoration:underline;min-height:40px;padding:0 6px}
@media (prefers-reduced-motion:reduce){.b-app *,.b-sheet *{animation:none!important;transition:none!important}}
@media (max-width:360px){.b-hero .b-amount{font-size:2.8rem}.b-strip .v{font-size:1rem}}

/* ── Personaje y progresión ── */
.b-scene{border-radius:var(--r-c) var(--r-c) 0 0;overflow:hidden;line-height:0}
.b-scene svg{image-rendering:pixelated}
.b-herocard{background:var(--card);border:1px solid var(--border);border-radius:var(--r-l);overflow:hidden}
.b-herocard .b-scene{border-radius:0}
.b-herocard-body{padding:16px 18px 18px}
.b-lvl-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.b-lvl-n{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.b-lvl-t{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.b-lvl-stats{display:flex;gap:12px;font-size:.85rem;font-weight:700;color:var(--dim);flex-wrap:wrap}
.b-lvl-story{color:var(--dim);font-size:.92rem;margin:10px 0 0}
.b-lvl-next{margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.b-lvl-next-h{font-size:.9rem;color:var(--dim);margin-bottom:6px}
.b-lvl-next-h b{color:var(--text)}
.b-req{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:.92rem}
.b-req-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex:none;display:grid;place-items:center;font-size:.72rem;font-weight:800;color:#fff;margin-top:1px}
.b-req.ok .b-req-dot{background:var(--emerald);border-color:var(--emerald)}
.b-req.ok .b-req-l{color:var(--muted)}
.b-req-l{flex:1;min-width:0}
.b-req-bar{display:block;height:6px;border-radius:99px;background:var(--surface);overflow:hidden;margin-top:6px}
.b-req-bar i{display:block;height:100%;background:var(--violet);border-radius:99px}
.b-roadmap{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 6px}
.b-road{display:flex;flex-direction:column;align-items:center;text-align:center;opacity:.45}
.b-road.done{opacity:.8}
.b-road.cur{opacity:1}
.b-road-hero{width:44px;height:54px}
.b-road-hero svg{image-rendering:pixelated}
.b-road-n{font-size:.72rem;font-weight:800;color:var(--muted);margin-top:2px}
.b-road.cur .b-road-n{color:#fff;background:var(--violet);border-radius:99px;padding:0 7px}
.b-road-t{font-size:.7rem;font-weight:600;line-height:1.2;margin-top:2px}
.b-app .b-game{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.b-game>.b-game-hero{grid-row:span 4;width:52px;height:64px;background:rgba(255,255,255,.16);border-radius:12px;padding:4px}
.b-game>.b-game-hero svg{image-rendering:pixelated}
.b-game-next{font-size:.86rem;opacity:.92;margin-top:10px}

/* Tienda */
.b-shop-bits{font-weight:800}
.b-seg{display:flex;gap:18px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.b-app .b-seg button{padding:10px 0;min-height:44px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.b-app .b-seg button.on{color:var(--text);border-color:var(--indigo)}
.b-shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.b-shop-item{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;border-radius:var(--r-c);background:var(--card);border:1px solid var(--border);text-align:center}
.b-shop-item.on{border:2px solid var(--indigo);padding:11px}
.b-shop-prev{width:100%;aspect-ratio:16/10;display:grid;place-items:center;background:var(--surface);border-radius:var(--r-s);overflow:hidden;max-width:100%}
.b-shop-prev svg{image-rendering:pixelated;max-height:100%}
.b-shop-name{font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:6px}
.b-swatch{width:12px;height:12px;border-radius:4px;display:inline-block}
.b-shop-state{font-size:.82rem;color:var(--muted);font-weight:600;min-height:44px;display:flex;align-items:center}
.b-app .b-secondary.buy{background:var(--mango);color:#18212F}
.b-app .b-secondary:disabled{opacity:.45}
.b-app .b-secondary.danger{color:var(--danger)}

/* Formularios nuevos */
.b-form{display:flex;flex-direction:column;gap:12px;margin-top:10px;padding:16px;border-radius:var(--r-c);background:var(--card);border:1px solid var(--border)}
.b-field{display:flex;flex-direction:column;gap:6px;font-size:.88rem;font-weight:600;color:var(--dim)}
.b-field input{font:inherit;font-size:1.05rem;font-weight:600;color:var(--text);background:transparent;border:0;border-bottom:2px solid var(--border);padding:8px 0;border-radius:0;outline:none}
.b-field input:focus{border-color:var(--indigo)}
.b-form-btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.b-app .b-primary.sm{width:auto;min-height:44px;padding:0 20px;font-size:.95rem}
.b-app .b-primary.ghost{background:var(--surface);color:var(--text);margin-top:12px;min-height:52px}

/* ── Asistente de deudas ── */
.b-wiz-step{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.b-wiz-q{font-weight:800;font-size:1.45rem;line-height:1.2;letter-spacing:-.02em;text-wrap:balance}
.b-wiz-help{font-size:.94rem;color:var(--dim)}
.b-opts{display:flex;flex-direction:column}
.b-sheet .b-opt{display:flex;gap:14px;align-items:center;text-align:left;padding:14px 0;border-bottom:1px solid var(--border);min-height:64px;width:100%}
.b-sheet .b-opt:last-child{border-bottom:0}
.b-opt .t{display:block;font-weight:700}
.b-opt .s{display:block;font-size:.86rem;color:var(--muted)}
.b-opt.sel .t{color:var(--accent)}
.b-sheet .b-field{display:flex;flex-direction:column;gap:6px;font-size:.9rem;font-weight:600;color:var(--dim)}
.b-in{width:100%;font:inherit;font-size:1.6rem;font-weight:800;color:var(--text);background:transparent;border:0;border-bottom:2px solid var(--border);padding:10px 0;border-radius:0;outline:none;font-family:var(--font)}
.b-in.text{font-size:1.2rem;font-weight:700}
.b-in:focus{border-color:var(--indigo)}
.b-wiz-foot{display:flex;gap:10px;margin-top:4px}
.b-sheet .b-wiz-foot .b-secondary{flex:1;min-height:58px;border-radius:var(--r-b);background:var(--surface);font-weight:600;display:flex;align-items:center;justify-content:center}
.b-sheet .b-wiz-foot .b-primary{flex:2}
.b-sheet .b-primary:disabled{opacity:.4}

/* ── Aviso de niveles ── */
.b-notice{display:flex;gap:14px;align-items:flex-start;background:var(--ps);border-radius:var(--r-c);padding:16px}
.b-notice-hero{width:48px;height:60px;flex:none}
.b-notice-hero svg{image-rendering:pixelated}
.b-notice b{font-weight:800}
.b-notice p{margin:6px 0 0;font-size:.9rem;color:var(--dim)}
.b-notice-btns{display:flex;gap:14px;align-items:center;margin-top:10px;flex-wrap:wrap}
.b-app .b-notice .b-secondary{background:var(--card)}

/* ── Recordatorio ── */
.b-remind-btns{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.b-app a.b-secondary{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:var(--r-b);background:var(--surface);color:var(--text);font-weight:600;text-decoration:none}

/* ── Secciones anteriores con el sistema de Budgy ── */
.b-legacy .card,.b-legacy .suggestion-card,.b-legacy .cf-card,.b-legacy .emer-card{background:transparent;border:0;border-radius:0;padding:0;margin-bottom:26px;box-shadow:none}
.b-legacy .ct{font-size:15px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--text);margin-bottom:12px}
.b-legacy .sec{font-size:14px;letter-spacing:0;text-transform:none;color:var(--text);font-weight:700;border-bottom:1px solid var(--border);margin:18px 0 10px}
.b-legacy .fl,.b-legacy .q-lbl,.b-legacy .chip-l,.b-legacy .cf-month-name,.b-legacy .night-stat-l,.b-legacy .daily-big-lbl{text-transform:none;letter-spacing:0;font-size:12px;font-weight:600;color:var(--dim)}
.b-legacy .inp,.b-legacy .sel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:16px;min-height:46px;font-family:var(--font)}
.b-legacy .inp:focus,.b-legacy .sel:focus{border-color:var(--indigo)}
.b-legacy .q-box,.b-legacy .chip,.b-legacy .cf-month,.b-legacy .mvl-item,.b-legacy .night-stat,.b-legacy .briefing-stat{border:0;border-radius:12px;background:var(--card)}
.b-legacy .q-inp{font-family:var(--font)}
.b-legacy .btn-g{border-radius:12px;min-height:50px;font-size:15px;font-family:var(--font);background:var(--indigo);color:#fff}
.b-legacy .btn-sm{border-radius:12px;font-family:var(--font);min-height:44px}
.b-legacy .btn-x{border-radius:10px}
.b-legacy .type-btn{border-radius:12px;background:var(--card);font-family:var(--font)}
.b-legacy .method-btn{border-radius:12px;font-family:var(--font)}
.b-legacy .al{border:0;border-radius:12px}
.b-legacy .exp-row,.b-legacy .log-item,.b-legacy .suggestion-row{background:var(--card);border:0;border-radius:12px}
.b-legacy .pri-card,.b-legacy .cc-card{border-radius:16px}
.b-legacy .pbar,.b-legacy .cc-bar-bg{border-radius:99px}

/* ── Fase 3: deudas, historial, mi información ── */
.b-sheet .b-secondary{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:var(--r-b);background:var(--surface);font-weight:600;font-size:.9rem;white-space:nowrap}
.b-sheet .b-secondary.danger,.b-textbtn.danger{color:var(--danger)!important}
.b-in.sm{font-size:1.2rem;font-weight:700}
.b-field-help{font-size:.82rem;font-weight:500;color:var(--muted)}
.b-confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.88rem;font-weight:600}
.b-debt-head{display:flex;gap:14px;align-items:center}
.b-debt-head .b-wiz-q{font-size:1.3rem}
.b-dots{display:flex;flex-wrap:wrap;gap:5px}
.b-dots i{width:14px;height:14px;border-radius:50%;background:var(--surface);border:1px solid var(--border)}
.b-dots i.on{background:var(--emerald);border-color:var(--emerald)}
.b-paid{display:flex;align-items:center;gap:10px;color:var(--good);font-weight:700;background:var(--gs);border-radius:var(--r-b);padding:12px 14px}
.b-paid span{flex:1}
.b-payrow{display:flex;flex-direction:column;gap:12px}
.b-insight-box{background:var(--bs);border-radius:var(--r-c);padding:14px 16px}
.b-insight-box b{display:block}
.b-insight-box p{margin:4px 0 0;font-size:.9rem;color:var(--dim)}
.b-note.good{color:var(--good);font-weight:700}
.b-months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center;font-size:.76rem;color:var(--muted);font-weight:600}
.b-months i{display:grid;place-items:center;width:28px;height:28px;margin:0 auto 4px;border-radius:50%;background:var(--surface);font-style:normal;color:#fff;font-weight:800}
.b-months .on i{background:var(--emerald)}
.b-sheet-foot{display:flex;justify-content:center;padding-top:6px;border-top:1px solid var(--border)}
.b-first{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.b-ok{color:var(--good);font-weight:700}
.b-rows>button .b-m{text-align:left}
.b-day{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:20px}
.b-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.b-textarea{font:inherit;font-size:.85rem;min-height:80px;border:1px solid var(--border);border-radius:var(--r-b);padding:10px;background:var(--card);color:var(--text)}
.b-ticket{max-width:100%;border-radius:var(--r-b)}
.b-app .b-rows .b-textbtn{min-height:40px}

/* ── Fase 4: Presupuesto ── */
.b-health{display:flex;align-items:center;gap:16px}
.b-health .v{font-size:2.8rem;font-weight:800;line-height:1}
.b-health .l{font-weight:800}
.b-meter{display:flex;gap:4px;margin:6px 0 4px}
.b-meter i{width:26px;height:6px;border-radius:99px;background:var(--surface)}
.b-factors{margin-top:10px}
.b-tips>div{align-items:flex-start!important;font-size:.93rem}
.b-tip-ic{font-size:1.2rem;line-height:1.3;width:26px;text-align:center;flex:none}
.b-verdict{border-radius:var(--r-c);padding:14px 16px;margin-top:14px}
.b-verdict.ok{background:var(--gs)}
.b-verdict.no{background:var(--ws)}
.b-verdict b{display:block}
.b-verdict p{margin:4px 0 0;font-size:.92rem;color:var(--dim)}
.b-more-body>*+*{margin-top:12px}
.b-cmp{display:grid;grid-template-columns:1fr auto auto;gap:8px 16px;font-size:.9rem;align-items:baseline}
.b-cmp .h{font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.b-cardrow{flex-direction:column;align-items:stretch!important;gap:8px!important}
.b-cardrow-top{display:flex;justify-content:space-between;gap:10px}
.b-app .b-check,.b-sheet .b-check{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;color:#fff;font-weight:800;flex:none;text-align:center}
.b-app .b-check.on,.b-sheet .b-check.on{background:var(--emerald);border-color:var(--emerald)}
.b-chips{display:flex;flex-wrap:wrap;gap:8px}
.b-app .b-chip,.b-sheet .b-chip{min-height:40px;padding:0 14px;border-radius:var(--r-b);background:var(--surface);font-weight:600;font-size:.86rem}
.b-app .b-chip.on,.b-sheet .b-chip.on{background:var(--indigo);color:#fff}
.b-in-inline{width:96px;font:inherit;font-weight:700;text-align:right;border:0;border-bottom:2px solid var(--border);background:transparent;color:var(--text);padding:6px 0;outline:none;font-family:var(--font)}
.b-in-inline:focus{border-color:var(--indigo)}

/* ── Fase 5: juego y anotado avanzado ── */
.b-xp{font-size:.8rem;font-weight:800;color:var(--purple);white-space:nowrap}

function getWealth(data) {
  const assets = data.assets || [];
  const inv = invTotals(data);
  const assetsTotal = assets.reduce((s, a) => s + (+a.value || 0), 0) + inv.total;
  const invested = assets.filter(a => a.type === 'inversion').reduce((s, a) => s + (+a.value || 0), 0) + inv.total;
  const passive = assets.reduce((s, a) => s + (+a.monthlyIncome || 0), 0) + inv.monthly;
  // Si el fondo vive en una inversión, ya está contado en inv.total
  const emer = emerInv(data) ? 0 : +data.emerSaved || 0;
  const debt = getTotalDebt(data);
  const monthlyExp = (data.exps || []).reduce((s, e) => s + (+e.amount || 0), 0) + (data.varExps || []).reduce((s, e) => s + (+e.amount || 0), 0);
  const cardDebt = (data.debts || []).filter(d => d.type === 'tarjeta').reduce((s, d) => s + (+d.balance || 0), 0);
  // Tu dinero del día a día: con saldo real, lo que hay en cuenta y efectivo (ahí viven tus apartados)
  const dp0 = calcDP(data);
  const cash = dp0.hasSaldo ? Math.max(0, dp0.currentDebit) + Math.max(0, dp0.currentEfectivo) : apartadosTotal(data);
  return {
    assetsTotal, invested, passive, emer, debt, monthlyExp, cardDebt, cash,
    netWorth: assetsTotal + emer + cash - debt
  };
}
const moneyShort = n => n >= 1e6 ? '$' + (n / 1e6).toLocaleString('es-MX', { maximumFractionDigits: 1 }) + ' M' : fmt(n);

// Requisitos reales para ESTAR en el nivel n (además de la XP)
function levelReqs(n, data, game) {
  const w = getWealth(data);
  const income = (+data.q1 || 0) + (+data.q2 || 0);
  const days = new Set([...(data.cashTransactions || []), ...(data.cardTransactions || [])].map(t => t.date)).size;
  const goal = +data.emerGoal || 0;
  const emerPct = goal > 0 ? emerSavedOf(data) / goal : 0;
  const dp = calcDP(data);
  const pctTxt = p => Math.min(100, Math.round(p * 100)) + '%';
  switch (n) {
    case 1: return [{ label: 'Registra cuánto ganas por quincena', ok: income > 0, where: 'perfil' }];
    case 2: return [{ label: `Anota tus gastos en 10 días distintos (${Math.min(days, 10)}/10)`, ok: days >= 10, where: 'add' }];
    case 3: return [
      { label: 'Registra tus gastos fijos (renta, luz, etc.)', ok: (data.exps || []).length > 0, where: 'presupuesto' },
      { label: 'Mantén tu quincena en verde', ok: dp.income > 0 && dp.available >= 0, where: 'inicio' }
    ];
    case 4: return [{ label: `Fondo de emergencia al 25% (vas en ${pctTxt(emerPct)})`, ok: emerPct >= 0.25, where: 'metas' }];
    case 5: return [
      { label: `Fondo de emergencia al 50% (vas en ${pctTxt(emerPct)})`, ok: emerPct >= 0.5, where: 'metas' },
      { label: `15 días dentro de tu presupuesto (${Math.min(game.budgetDays || 0, 15)}/15)`, ok: (game.budgetDays || 0) >= 15, where: 'add' }
    ];
    case 6: return [
      { label: `Fondo de emergencia completo (vas en ${pctTxt(emerPct)})`, ok: emerPct >= 1, where: 'metas' },
      { label: 'Registra tu primera inversión', ok: w.invested > 0, where: 'metas' }
    ];
    case 7: return [{ label: `Patrimonio neto de $500,000 (llevas ${moneyShort(Math.max(0, w.netWorth))})`, ok: w.netWorth >= 500000, where: 'metas' }];
    case 8: return [{ label: `Patrimonio neto de $1,000,000 (llevas ${moneyShort(Math.max(0, w.netWorth))})`, ok: w.netWorth >= 1000000, where: 'metas' }];
    case 9: return [
      { label: 'Tus ingresos pasivos cubren tus gastos del mes', ok: w.monthlyExp > 0 && w.passive >= w.monthlyExp, where: 'metas' },
      { label: 'Cero deuda en tarjetas de crédito', ok: w.cardDebt === 0, where: 'metas' }
    ];
    default: return [];
  }
}
// El nivel más alto que tu situación real permite
function computeLevelCap(data, game) {
  let cap = 0;
  for (let n = 1; n < LEVELS.length; n++) {
    if (levelReqs(n, data, game).every(r => r.ok)) cap = n;else break;
  }
  return cap;
}
window.__budgyCap = 9;
const xpLevel = xp => [...LEVELS].reverse().find(l => xp >= l.min) || LEVELS[0];
const getLvl = xp => LEVELS[Math.min(xpLevel(xp || 0).n, window.__budgyCap)];
const getXPProg = xp => {
  const l = getLvl(xp);
  const next = LEVELS[l.n + 1];
  if (!next) return { pct: 100, cur: 0, need: 0, blocked: false, next: null };
  const need = next.min - l.min;
  const cur = Math.max(0, (xp || 0) - l.min);
  return {
    pct: Math.min(100, Math.round(cur / need * 100)),
    cur: Math.min(cur, need),
    need,
    blocked: (xp || 0) >= next.min,
    next
  };
};

  return [...ALL_MISSIONS].sort((a, b) => (seed * 37 + a.id.charCodeAt(2) * 19) % 100 - (seed * 37 + b.id.charCodeAt(2) * 19) % 100).slice(0, 3);

function checkMission(id, data, game, todayStr) {
  const todayAll = [...(data.cashTransactions || []), ...(data.cardTransactions || [])].filter(t => t.date === todayStr);
  const todayCard = (data.cardTransactions || []).filter(t => t.date === todayStr);
  const dp = calcDP(data);
  const h = new Date().getHours();
  switch (id) {
    case 'm_mañanero':
      return game.morningCheckIn === todayStr;
    case 'm_primer':
      return todayAll.length >= 1;
    case 'm_limite':
      return dp.remaining >= 0 && todayAll.length > 0;
    case 'm_tarjeta':
      return todayCard.length >= 1;
    case 'm_racha':
      return todayAll.length >= 1 || (data.noSpendDays || []).includes(todayStr);
    case 'm_noche':
      return game.nightCheck === todayStr;
    case 'm_deudas':
      return game.debtTabVisited === todayStr;
    case 'm_austeridad':
      return dp.cashSpentToday < dp.daily * 0.5 && dp.daily > 0 && todayAll.length > 0;
    case 'm_verde':
      return dp.remaining > 0 && dp.income > 0;
    case 'm_info':
      return game.infoTabVisited === todayStr;
    case 'm_3gastos':
      return todayAll.length >= 3;
    case 'm_5gastos':
      return todayAll.length >= 5;
    case 'm_sintar':
      return todayCard.length === 0 && todayAll.length >= 1;
    case 'm_sesion2':
      return (game.sessionCount || 0) >= 2;
    default:
      return false;
  }
}

/* ════ FASE 9: racha real, respaldo, búsqueda y exportación, favoritos,
   límites por categoría, apartados y cierre de quincena ════ */
const todayISO = () => new Date().toLocalISO().slice(0, 10);
const shiftDay = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toLocalISO().slice(0, 10); };
function spendTx(data) {
  return [...(data.cashTransactions || []).map(t => ({ ...t, kind: 'cash' })), ...(data.cardTransactions || []).map(t => ({ ...t, kind: 'card' }))];
}
function loggedDays(data) {
  const s = new Set(spendTx(data).map(t => t.date).filter(Boolean));
  (data.noSpendDays || []).forEach(d => s.add(d));
  return s;
}
// Racha = días seguidos anotando (un gasto o "hoy no gasté"). Si hoy aún no anotas, cuenta hasta ayer.
function logStreak(data, today) {
  const days = loggedDays(data);
  let d = today || todayISO(), n = 0;
  if (!days.has(d)) d = shiftDay(d, -1);
  while (days.has(d)) { n++; d = shiftDay(d, -1); }
  return n;
}

/* ── Respaldo ── */
// El PIN no viaja en el respaldo: en el teléfono nuevo creas uno
const BACKUP_KEYS = ['mipres-name', 'mipres-data-v6', 'mipres-game-v5', 'budgy-prefs'];
const u8b64 = u8 => { let t = ''; for (let i = 0; i < u8.length; i += 0x8000) t += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(t); };
const b64u8 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function backupKey(pass, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptBackup(txt, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await backupKey(pass, salt), new TextEncoder().encode(txt));
  return JSON.stringify({ budgy: 'respaldo-cifrado', v: 1, salt: u8b64(salt), iv: u8b64(iv), data: u8b64(new Uint8Array(ct)) });
}
async function decryptBackup(obj, pass) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64u8(obj.iv) }, await backupKey(pass, b64u8(obj.salt)), b64u8(obj.data));
  return new TextDecoder().decode(pt);
}
function downloadText(name, txt, type) {
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([txt], { type }));
  link.download = name;
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 4000);
}
// En el cel abre "Compartir" (guardar en Archivos, Drive o WhatsApp); en compu lo descarga
async function budgyBackup(pass) {
  const obj = {};
  BACKUP_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v) obj[k] = v; });
  const name = `budgy-respaldo-${todayISO()}.json`;
  const txt = pass ? await encryptBackup(JSON.stringify(obj), pass) : JSON.stringify(obj);
  const mobile = isIOS() || /Android/i.test(navigator.userAgent);
  let shared = false;
  if (mobile && navigator.canShare && window.File) {
    const file = new File([txt], name, { type: 'application/json' });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Respaldo de Budgy' }); shared = true; }
      catch (err) { if (err && err.name === 'AbortError') return false; }
    }
  }
  if (!shared) downloadText(name, txt, 'application/json');
  saveLS('budgy-last-backup', todayISO());
  return true;
}
// Pide respaldo si hay datos que perder y el último tiene más de un mes
function backupDue(data, prefs) {
  if (spendTx(data).length < 10) return false;
  const today = todayISO();
  if (prefs.backupSnooze && prefs.backupSnooze > today) return false;
  const last = loadLS('budgy-last-backup');
  return !last || last <= shiftDay(today, -30);
}

/* ── Favoritos que Budgy aprende solo ── */
function learnFavorites(data, max) {
  const since = shiftDay(todayISO(), -90);
  const cardIds = new Set((data.debts || []).filter(d => d.type === 'tarjeta').map(d => d.id));
  const groups = {};
  spendTx(data).forEach(t => {
    if (!t.date || t.date < since || !quickCat(t.cat) || !(+t.amount > 0)) return;
    if (t.kind === 'card' && !cardIds.has(t.cardId)) return;
    const desc = (t.desc || '').trim();
    const method = t.kind === 'card' ? 'card' : t.method === 'debit' ? 'debit' : 'cash';
    const k = [t.cat, desc.toLowerCase(), Math.round(+t.amount), method, t.kind === 'card' ? t.cardId : ''].join('|');
    const g = groups[k] || (groups[k] = { k, cat: t.cat, desc, amount: Math.round(+t.amount), method, cardId: t.cardId || '', n: 0, last: '' });
    g.n++;
    if (t.date > g.last) g.last = t.date;
  });
  return Object.values(groups).filter(g => g.n >= 3).sort((a, b) => b.n - a.n || b.last.localeCompare(a.last)).slice(0, max || 4);
}

/* ── Límites por categoría (son tus gastos variables: una sola cifra al mes) ── */
function catLimit(data, catId) {
  const v = (data.varExps || []).find(x => x.catId === catId);
  return v ? +v.amount || 0 : 0;
}
function catSpentMonth(data, catId, mk) {
  mk = mk || todayISO().slice(0, 7);
