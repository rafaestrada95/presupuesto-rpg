<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#07090f"/>
<title>Mi Presupuesto RPG</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap');
:root{
  --bg:#07090f;--surface:#0e1420;--card:#141d2e;--border:#1d2e47;
  --accent:#22d3a5;--as:rgba(34,211,165,.13);--am:rgba(34,211,165,.28);
  --danger:#f87171;--ds:rgba(248,113,113,.13);
  --warn:#fbbf24;--ws:rgba(251,191,36,.13);
  --blue:#60a5fa;--bs:rgba(96,165,250,.13);
  --purple:#c084fc;--ps:rgba(192,132,252,.13);
  --orange:#fb923c;
  --text:#dce8f8;--muted:#5b7799;--dim:#8aaac8;--faint:#1d2e47;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Instrument Sans',sans-serif;-webkit-tap-highlight-color:transparent}
#root{min-height:100vh}

/* ── PIN ── */
.pin-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px}
.pin-logo{font-family:'Bricolage Grotesque',sans-serif;font-size:11px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--accent);margin-bottom:8px;text-align:center}
.pin-title{font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:800;margin-bottom:6px;text-align:center}
.pin-sub{font-size:13px;color:var(--muted);margin-bottom:32px;text-align:center;line-height:1.5;max-width:260px}
.pin-dots{display:flex;gap:14px;margin-bottom:10px}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);transition:all .2s}
.pin-dot.filled{background:var(--accent);border-color:var(--accent)}
.pin-dot.error{background:var(--danger);border-color:var(--danger)}
.pin-err{font-size:12px;color:var(--danger);height:18px;margin-bottom:18px;text-align:center}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:280px}
.pin-btn{height:64px;border-radius:16px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700;cursor:pointer;-webkit-appearance:none;display:flex;align-items:center;justify-content:center;transition:all .15s}
.pin-btn:active{background:var(--accent);color:#04150f;transform:scale(.95)}
.pin-btn.clear{font-size:13px;font-family:'Instrument Sans',sans-serif;font-weight:600;color:var(--muted)}
.pin-btn.empty{background:transparent;border:none;cursor:default}
.pin-name-inp{width:100%;max-width:280px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 16px;color:var(--text);font-family:'Instrument Sans',sans-serif;font-size:15px;outline:none;margin-bottom:28px;text-align:center;-webkit-appearance:none}
.pin-name-inp:focus{border-color:var(--accent)}
.pin-name-inp::placeholder{color:var(--muted)}

/* ── ONBOARDING ── */
@keyframes obIn{0%{opacity:0;transform:translateX(30px)}100%{opacity:1;transform:none}}
@keyframes obOut{0%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-30px)}}
.ob-overlay{position:fixed;inset:0;z-index:8000;display:flex;flex-direction:column;overflow:hidden}
.ob-bg{position:absolute;inset:0}
.ob-content{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;padding:0}
.ob-step{flex:1;min-height:0;display:flex;flex-direction:column;padding:40px 24px 0;animation:obIn .35s ease}
.ob-step.leaving{animation:obOut .25s ease forwards}
.ob-header{margin-bottom:24px;flex-shrink:0}
.ob-icon{font-size:44px;margin-bottom:14px}
.ob-step-num{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:8px;opacity:.8}
.ob-title{font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:800;line-height:1.15;margin-bottom:8px}
.ob-sub{font-size:13px;color:var(--dim);line-height:1.6;max-width:300px}
.ob-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ob-footer{flex-shrink:0;padding:20px 24px 40px;display:flex;flex-direction:column;gap:10px}
.ob-progress{display:flex;gap:6px;justify-content:center;margin-bottom:4px}
.ob-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .3s}
.ob-dot.active{background:var(--accent);width:18px;border-radius:3px}
.ob-dot.done{background:var(--accent);opacity:.5}
.ob-btn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--accent);color:#04150f;font-family:'Instrument Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;-webkit-appearance:none;transition:all .15s}
.ob-btn:active{transform:scale(.98)}
.ob-skip{font-size:12px;color:var(--muted);text-align:center;cursor:pointer;padding:4px}
.ob-expense-row{display:flex;gap:8px;margin-bottom:10px}
.ob-quick-debt{padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:10px}

/* ── APP ── */
.app{max-width:480px;margin:0 auto;padding:16px 13px 90px}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.eye{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.h1{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(18px,4vw,24px);font-weight:800}
.hdr-sub{color:var(--muted);font-size:11px;margin-top:2px}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.save-pill{display:flex;align-items:center;gap:5px;font-size:10px;padding:3px 9px;border-radius:99px}
.save-dot{width:6px;height:6px;border-radius:50%}
.lock-btn{font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px 10px;cursor:pointer;-webkit-appearance:none}
.tabs{display:flex;gap:2px;background:var(--surface);border-radius:12px;padding:3px;margin-bottom:12px;border:1px solid var(--border)}
.tab{flex:1;padding:8px 1px;border-radius:9px;border:none;background:transparent;color:var(--muted);font-family:'Instrument Sans',sans-serif;font-size:10px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center;-webkit-appearance:none}
.tab.on{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.6)}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.ct{font-family:'Bricolage Grotesque',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:11px;display:flex;align-items:center;gap:5px}

/* ── HERO CARD ── */
.hero-card{border-radius:20px;margin-bottom:10px;overflow:hidden;position:relative;border:2px solid}
.world-scene{width:100%;height:155px;display:block}
.hero-aura{position:absolute;top:0;right:0;width:150px;height:150px;border-radius:50%;opacity:.12;filter:blur(35px);pointer-events:none}
.hero-bottom{padding:14px}
.hero-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.hero-name{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:800;line-height:1.1;margin-bottom:1px}
.hero-title{font-size:11px;font-weight:600;opacity:.8;margin-bottom:5px}
.hero-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:1px;text-transform:uppercase;border:1px solid}
.xp-bar-bg{height:10px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-bottom:4px}
.xp-bar-fill{height:100%;border-radius:99px;transition:width 1s cubic-bezier(.34,1.56,.64,1)}
.xp-labels{display:flex;justify-content:space-between;font-size:10px;opacity:.6;margin-bottom:10px}
.streak-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px;background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.3);color:var(--warn)}

/* ── LEVEL UP ── */
@keyframes luIn{0%{opacity:0;transform:scale(.3)}60%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes luOut{0%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes luGlow{0%,100%{box-shadow:0 0 40px var(--lu-c,#22d3a5)}50%{box-shadow:0 0 80px var(--lu-c,#22d3a5)}}
.lu-overlay{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(7,9,15,.96);padding:30px}
.lu-overlay.in{animation:luIn .6s cubic-bezier(.34,1.56,.64,1) forwards}
.lu-overlay.out{animation:luOut .4s ease forwards;pointer-events:none}
.lu-confetti{position:absolute;width:10px;height:10px;border-radius:2px;animation:confettiFall 2.5s ease-in forwards}
.lu-ring{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:20px;position:relative;border:4px solid;animation:luGlow 1.5s ease infinite}
@keyframes ringPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.05)}}
.lu-ring-inner{position:absolute;inset:-10px;border-radius:50%;border:2px solid;animation:ringPulse 1s ease infinite;pointer-events:none}
.lu-badge{font-size:11px;font-weight:700;letter-spacing:4px;text-transform:uppercase;margin-bottom:6px;opacity:.8}
.lu-level{font-family:'Bricolage Grotesque',sans-serif;font-size:56px;font-weight:800;line-height:1;margin-bottom:4px}
.lu-title{font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:800;margin-bottom:10px;text-align:center;line-height:1.2}
.lu-story{font-size:13px;max-width:260px;text-align:center;line-height:1.6;color:var(--dim);margin-bottom:28px}
.lu-actions{display:flex;gap:10px;width:100%;max-width:300px}
.lu-tap{flex:1;font-size:13px;color:var(--muted);border:1px solid var(--border);border-radius:99px;padding:12px 24px;cursor:pointer;background:transparent;font-family:'Instrument Sans',sans-serif;font-weight:600;-webkit-appearance:none}
.lu-share{flex:0 0 auto;font-size:13px;color:var(--accent);border:1px solid rgba(34,211,165,.3);border-radius:99px;padding:12px 16px;cursor:pointer;background:rgba(34,211,165,.1);font-family:'Instrument Sans',sans-serif;font-weight:600;-webkit-appearance:none}

/* ── PLAN PROGRESS ── */
.plan-card{border-radius:16px;padding:14px;margin-bottom:10px;border:2px solid}
.plan-dots{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.plan-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;transition:all .3s;flex-shrink:0}
.plan-dot.paid{background:var(--accent);color:#04150f}
.plan-dot.current{background:var(--warn);color:#0a0500;animation:pillPulse 1.5s ease infinite}
.plan-dot.pending{background:var(--border);color:var(--muted)}
.plan-mark-btn{width:100%;padding:11px;border-radius:10px;border:none;cursor:pointer;font-family:'Instrument Sans',sans-serif;font-size:13px;font-weight:700;-webkit-appearance:none;margin-top:10px;transition:all .2s}
@keyframes payBurst{0%{transform:scale(1)}30%{transform:scale(1.15)}60%{transform:scale(.95)}100%{transform:scale(1)}}
.plan-mark-btn:active{animation:payBurst .4s ease}

/* ── CASH FLOW ── */
.cf-card{border-radius:14px;padding:14px;margin-bottom:10px;background:var(--card);border:1px solid var(--border)}
.cf-months{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.cf-month{background:var(--surface);border-radius:12px;padding:11px;text-align:center;border:1px solid var(--border)}
.cf-month.good{border-color:rgba(34,211,165,.3);background:rgba(34,211,165,.06)}
.cf-month.ok{border-color:rgba(96,165,250,.25);background:rgba(96,165,250,.05)}
.cf-month.warn{border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.06)}
.cf-month.danger{border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.08)}
.cf-month-name{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:6px}
.cf-bar-wrap{height:50px;display:flex;align-items:flex-end;justify-content:center;gap:4px;margin-bottom:6px}
.cf-bar{border-radius:3px 3px 0 0;min-height:4px;transition:height .4s}
.cf-net{font-family:'Bricolage Grotesque',sans-serif;font-size:13px;font-weight:800}
.cf-net-label{font-size:9px;color:var(--muted);margin-top:2px}
.cf-status{font-size:14px;margin-bottom:2px}

/* ── COUNTDOWN ── */
.cd-rail{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.cd-rail::-webkit-scrollbar{display:none}
.cd-pill{flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:11px 13px;min-width:92px;text-align:center}
.cd-pill.urgent{border-color:rgba(248,113,113,.5);background:var(--ds)}
.cd-pill.warn{border-color:rgba(251,191,36,.4);background:var(--ws)}
@keyframes pillPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.cd-pill.urgent{animation:pillPulse 1.5s ease infinite}
.cd-num{font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:800;line-height:1}

/* ── MISSIONS ── */
.mission-card{border-radius:14px;padding:14px;margin-bottom:10px;background:var(--card);border:1px solid var(--border)}
.mission-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.mission-row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--surface);border-radius:11px;margin-bottom:7px;border:1px solid var(--border);transition:all .3s}
.mission-row.done{border-color:rgba(34,211,165,.3);background:rgba(34,211,165,.06)}
.mission-row:last-child{margin-bottom:0}
.mission-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;transition:all .3s}
.mission-row.done .mission-check{background:var(--accent);border-color:var(--accent)}
.mission-name{font-size:13px;font-weight:600;flex:1}
.mission-row.done .mission-name{text-decoration:line-through;opacity:.55}
.mission-desc{font-size:10px;color:var(--muted);margin-top:1px}
.mission-xp{font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px;flex-shrink:0}
.mission-row.done .mission-xp{background:var(--as);color:var(--accent)}
.mission-row:not(.done) .mission-xp{background:var(--ws);color:var(--warn)}

/* ── SUGGESTION ── */
.suggestion-card{border-radius:14px;padding:14px;margin-bottom:10px;background:linear-gradient(135deg,rgba(34,211,165,.07),rgba(96,165,250,.05));border:1px solid rgba(34,211,165,.22)}
.suggestion-row{display:flex;align-items:flex-start;gap:10px;padding:9px;background:rgba(0,0,0,.18);border-radius:10px;margin-bottom:7px}
.suggestion-row:last-child{margin-bottom:0}

/* ── NIGHT/STREAK ── */
.night-card{background:linear-gradient(135deg,rgba(192,132,252,.1),rgba(96,165,250,.08));border:1px solid rgba(192,132,252,.3);border-radius:16px;padding:14px;margin-bottom:10px}
.night-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.night-stat{background:rgba(0,0,0,.2);border-radius:10px;padding:10px;text-align:center}
.night-stat-n{font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:800}
.night-stat-l{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-top:2px}
@keyframes warnShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.streak-warn{background:var(--ds);border:1px solid rgba(248,113,113,.35);border-radius:14px;padding:13px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.streak-warn-icon{font-size:30px;animation:warnShake 1s ease infinite}

/* ── CHEST ── */
@keyframes chestBounce{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-8px) rotate(-4deg)}70%{transform:translateY(-4px) rotate(3deg)}}
@keyframes chestGlow{0%,100%{box-shadow:0 0 18px rgba(251,191,36,.3)}50%{box-shadow:0 0 36px rgba(251,191,36,.7)}}
.chest-card{border-radius:18px;padding:18px;margin-bottom:10px;background:linear-gradient(135deg,rgba(251,191,36,.12),rgba(251,146,60,.08));border:2px solid rgba(251,191,36,.4);animation:chestGlow 2s ease infinite;cursor:pointer;text-align:center}
.chest-emoji{font-size:50px;display:block;margin-bottom:8px;animation:chestBounce 1.5s ease infinite}

/* ── BRIEFING ── */
.briefing{border-radius:18px;padding:16px;margin-bottom:12px;border:2px solid}
.briefing-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px}
.briefing-stat{background:rgba(0,0,0,.2);border-radius:10px;padding:10px;text-align:center}

/* ── DAILY ── */
.daily-main{border-radius:14px;padding:14px;margin-bottom:10px}
.daily-big-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;opacity:.8}
.daily-big-amt{font-family:'Bricolage Grotesque',sans-serif;font-size:36px;font-weight:800;line-height:1;margin-bottom:3px}
.daily-big-sub{font-size:11px;opacity:.7;margin-bottom:10px}
.daily-breakdown{background:rgba(0,0,0,.2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px}
.db-row{display:flex;justify-content:space-between;font-size:11px}
.db-label{color:var(--muted)}
.db-val{font-family:'Bricolage Grotesque',sans-serif;font-weight:700}
.db-div{height:1px;background:rgba(255,255,255,.07);margin:2px 0}

/* ── LOGGER ── */
.method-toggle{display:flex;gap:6px;margin-bottom:10px}
.method-btn{flex:1;padding:9px 6px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Instrument Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;text-align:center;-webkit-appearance:none;transition:all .2s}
.method-btn.on-cash{border-color:var(--accent);background:var(--as);color:var(--accent)}
.method-btn.on-card{border-color:var(--orange);background:rgba(251,146,60,.12);color:var(--orange)}
.log-row{display:flex;gap:6px;margin-bottom:8px}
.log-list{display:flex;flex-direction:column;gap:4px;max-height:160px;overflow-y:auto}
.log-item{display:flex;align-items:center;gap:6px;font-size:12px;padding:6px 8px;background:var(--surface);border-radius:8px;border:1px solid var(--border)}
.log-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;flex-shrink:0}
.batch-toggle{font-size:11px;color:var(--muted);text-align:center;padding:8px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* ── DEBT ── */
.pri-card{border-radius:12px;padding:11px;border:1px solid transparent;margin-bottom:7px}
.pri-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.pri-ico{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;font-weight:800;font-family:'Bricolage Grotesque',sans-serif}
.pri-name{font-weight:700;font-size:13px;font-family:'Bricolage Grotesque',sans-serif;line-height:1.2}
.pri-meta{font-size:10px;margin-top:2px;color:var(--dim)}
.pri-bal{font-family:'Bricolage Grotesque',sans-serif;font-size:14px;font-weight:800;margin-left:auto;flex-shrink:0}
.pri-foot{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.urg-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;display:inline-flex;align-items:center;gap:3px}
.pay-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;margin-left:auto;flex-shrink:0;background:var(--bs);color:var(--blue)}

/* ── SHARED ── */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}
.fg-full{grid-column:1/-1}
.ff{display:flex;flex-direction:column;gap:3px}
.fl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.inp{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 10px;color:var(--text);font-family:'Instrument Sans',sans-serif;font-size:15px;outline:none;transition:border-color .2s;-webkit-appearance:none}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:var(--muted)}

  const todayCard = (data.cardTransactions || []).filter(t => t.date === todayStr);
  const dp = calcDP(data);
  const h = new Date().getHours();
  switch (id) {
    case 'm_mañanero':
      return game.morningCheckIn === todayStr;
    case 'm_primer':
      return todayAll.length >= 1;
    case 'm_limite':
      return dp.remaining >= 0 && todayAll.length > 0;
    case 'm_tarjeta':
      return todayCard.length >= 1;
    case 'm_racha':
      return (game.streak || 0) >= 1;
    case 'm_noche':
      return game.nightCheck === todayStr;
    case 'm_deudas':
      return game.debtTabVisited === todayStr;
    case 'm_austeridad':
      return dp.cashSpentToday < dp.daily * 0.5 && dp.daily > 0 && todayAll.length > 0;
    case 'm_verde':
      return dp.remaining > 0 && dp.income > 0;
    case 'm_info':
      return game.infoTabVisited === todayStr;
    case 'm_3gastos':
      return todayAll.length >= 3;
    case 'm_5gastos':
      return todayAll.length >= 5;
    case 'm_sintar':
      return todayCard.length === 0 && todayAll.length >= 1;
    case 'm_sesion2':
      return (game.sessionCount || 0) >= 2;
    default:
      return false;
  }
}

/* ── CARD LOGIC ── */
function getCardInfo(card, cardTxs) {
  let today = arguments.length > 2 && arguments[2] !== undefined ? arguments[2] : new Date();
  if (!card.cutDay) return {
    cycleSpend: 0,
    cycleTxs: [],
    daysUntilCut: null,
    daysUntilPay: null,
    availableCredit: null
  };
  const day = today.getDate();
  const cutDay = +card.cutDay;
  const limit = +(card.creditLimit || 0);
  let cycleStart = day >= cutDay ? new Date(today.getFullYear(), today.getMonth(), cutDay) : new Date(today.getFullYear(), today.getMonth() - 1, cutDay);
  const cycleTxs = (cardTxs || []).filter(t => t.cardId === card.id && new Date(t.date) >= cycleStart);
  const cycleSpend = cycleTxs.reduce((s, t) => s + (+t.amount || 0), 0);
  const nextCut = cutDay > day ? new Date(today.getFullYear(), today.getMonth(), cutDay) : new Date(today.getFullYear(), today.getMonth() + 1, cutDay);
  const daysUntilCut = Math.ceil((nextCut - today) / 86400000);
  let daysUntilPay = null;
  if (card.dueDay) {
    const pd = +card.dueDay;
    const np = pd > day ? new Date(today.getFullYear(), today.getMonth(), pd) : new Date(today.getFullYear(), today.getMonth() + 1, pd);
    daysUntilPay = Math.ceil((np - today) / 86400000);
  }
  return {
    cycleSpend,
    cycleTxs,
    daysUntilCut,
    daysUntilPay,
    availableCredit: limit > 0 ? limit - +(card.balance || 0) - cycleSpend : null,
    limit
  };
}
function getTotalDebt(data) {
  return (data.debts || []).reduce((s, d) => s + (d.type === 'plan' ? getPlanInfo(d).remainingAmount : +(d.balance || 0)), 0);
}
function getPlanInfo(debt) {
  const total = +(debt.totalPayments || 0);
  const paid = +(debt.paidPayments || 0);
  const remaining = Math.max(0, total - paid);
  const amount = +(debt.paymentAmount || 0);
  return {
    total,
    paid,
    remaining,
    amount,
    remainingAmount: remaining * amount,
    totalAmount: total * amount
  };
}
function calcUrgency(debt) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  let target = null;
  if (debt.deadlineDate) target = new Date(debt.deadlineDate + "T12:00:00");else if (debt.dueDay) {
    target = new Date(today.getFullYear(), today.getMonth(), +debt.dueDay);
    if (target <= today) target = new Date(today.getFullYear(), today.getMonth() + 1, +debt.dueDay);
  }
  if (!target) return {
    key: "none",
    daysLeft: null
  };
  const daysLeft = Math.ceil((target - today) / 86400000);
  let key;
  if (debt.type === "deadline") key = daysLeft <= 5 ? "critical" : daysLeft <= 14 ? "danger" : daysLeft <= 30 ? "warn" : daysLeft <= 60 ? "moderate" : "ok";else key = daysLeft <= 2 ? "critical" : daysLeft <= 6 ? "danger" : daysLeft <= 13 ? "warn" : daysLeft <= 30 ? "moderate" : "ok";
  return {
    key,
    daysLeft
  };
}
// Cuánto te sangra una deuda al mes en intereses (no en pago de capital).
// Solo tarjeta/préstamo suelen tener tasa; plan/informal normalmente son 0%.
function getDebtInterestCost(d) {
  const rate = (+d.interestRate || 0) / 100;
  if (rate <= 0) return 0;
  const balance = d.type === 'plan' ? getPlanInfo(d).remainingAmount : +(d.balance || 0);
  return balance * (rate / 12);
}
// Si solo pagas el monto fijo cada mes, ¿cuántos meses tardas en liquidar y cuánto pagas de interés total?
// Amortización estándar. Si el pago no cubre ni el interés del mes, la deuda nunca se acaba (neverPaysOff).
function getPayoffProjection(balance, monthlyPayment, annualRatePct) {
  const B = +balance || 0;
  const P = +monthlyPayment || 0;
  const r = (+annualRatePct || 0) / 100 / 12;
  if (B <= 0 || P <= 0) return null;
  if (r <= 0) {
    const months = Math.ceil(B / P);
    return {
      months,
      totalPaid: B,
      totalInterest: 0,
      neverPaysOff: false
    };
  }
  const interestOnly = B * r;
  if (P <= interestOnly) {
    return {
      months: Infinity,
      totalPaid: Infinity,
      totalInterest: Infinity,
      neverPaysOff: true
    };
  }
  const months = Math.ceil(-Math.log(1 - r * B / P) / Math.log(1 + r));
  const totalPaid = P * months;
  const totalInterest = Math.max(0, totalPaid - B);
  return {
    months,
    totalPaid,
    totalInterest,
    neverPaysOff: false
  };
}
function sortDebts(debts) {
  const uw = {
    critical: 0,
    danger: 1,
    warn: 2,
    moderate: 3,
    ok: 4,
    none: 5
  };
  const tw = {
    deadline: 0,
    informal: 1,
    plan: 2,
    tarjeta: 3,
    prestamo: 4
  };
  return [...debts].map(d => ({
    ...d,
    urg: calcUrgency(d),
    interestCost: getDebtInterestCost(d)
  })).sort((a, b) => {
    // Fecha crítica (atrasarte te cuesta recargos/daño) siempre va primero, sin importar interés
    const aCrit = a.urg.key === 'critical';
    const bCrit = b.urg.key === 'critical';
    if (aCrit !== bCrit) return aCrit ? -1 : 1;
    // Entre las que no son urgentes por fecha, ataca primero la que más te sangra en intereses
    if (!aCrit && !bCrit && a.interestCost !== b.interestCost) return b.interestCost - a.interestCost;
    const u = uw[a.urg.key] - uw[b.urg.key];
    if (u !== 0) return u;
    if (a.urg.daysLeft != null && b.urg.daysLeft != null) return a.urg.daysLeft - b.urg.daysLeft;
    return tw[a.type] - tw[b.type];
  });
}
function calcDP(data) {
  const today = new Date();
  const day = today.getDate();
  const isQ1 = day <= 15;
  const baseIncome = parseFloat(isQ1 ? data.q1 : data.q2) || 0;
  const curMonth = today.toISOString().slice(0, 7);
  const extraQ = (data.extraIncome || []).reduce(function (s, ei) {
    return ei.type === "monthly" ? s + +(ei.amount || 0) / 2 : ei.type === "once" && (ei.date || "").startsWith(curMonth) ? s + +(ei.amount || 0) : s;
  }, 0);
  const income = baseIncome + extraQ;
  const lastDay = isQ1 ? 15 : new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
  const daysLeft = Math.max(1, lastDay - day + 1);
  const fixedQ = data.exps.filter(e => e.day && (isQ1 ? +e.day <= 15 : +e.day >= 16)).filter(e => !(data.paidExps || {})[`${e.id}_${curMonth}`]).reduce((s, e) => s + (+e.amount || 0), 0);
  const varH = data.varExps.reduce((s, e) => s + (+e.amount || 0), 0) / 2;
  const debtQ = data.debts.filter(d => d.type !== "tarjeta").reduce((s, d) => {
    const pay = d.type === "plan" ? +(d.paymentAmount || 0) : d.type === "informal" && d.informalMode === 'fixed' ? +(d.paymentAmount || 0) : +(d.minPayment || d.monthlyPayment || 0);
    if (!d.dueDay || !pay) return s;
    const dd = +d.dueDay;
    return isQ1 && dd <= 15 || !isQ1 && dd >= 16 ? s + pay : s;
  }, 0);
  const cardPayQ = data.debts.filter(d => d.type === "tarjeta" && d.dueDay && d.minPayment).reduce((s, d) => {
    const dd = +d.dueDay;
    return isQ1 && dd <= 15 || !isQ1 && dd >= 16 ? s + (+d.minPayment || 0) : s;
  }, 0);
  const cardReserved = data.debts.filter(d => d.type === "tarjeta").reduce((s, d) => s + getCardInfo(d, data.cardTransactions, today).cycleSpend, 0);
  const todayStr = today.toISOString().slice(0, 10);
  const cashSpentToday = (data.cashTransactions || []).filter(t => t.date === todayStr).reduce((s, t) => s + (+t.amount || 0), 0);
  const committed = fixedQ + varH + debtQ + cardPayQ + cardReserved + cashSpentToday;
  const remaining = income - committed;
  const saldoD = +data.saldoDebito || 0;
  const saldoE = +data.saldoEfectivo || 0;
  const hasSaldo = saldoD > 0 || saldoE > 0;
  let realBalance = null;
  let currentDebit = saldoD;
  let currentEfectivo = saldoE;
  if (hasSaldo) {
    const totalPaydays = (data.paydays || []).reduce((s, p) => s + (+p.amount || 0), 0);
    const spentDebit = (data.cashTransactions || []).filter(t => t.method === 'debit').reduce((s, t) => s + (+t.amount || 0), 0);
    const spentCash = (data.cashTransactions || []).filter(t => !t.method || t.method === 'cash').reduce((s, t) => s + (+t.amount || 0), 0);
    currentDebit = saldoD + totalPaydays - spentDebit;
    currentEfectivo = saldoE - spentCash;
    const pendingFixed = data.exps.filter(e => e.day && +e.day > day && (isQ1 ? +e.day <= 15 : +e.day >= 16)).filter(e => !(data.paidExps || {})[`${e.id}_${curMonth}`]).reduce((s, e) => s + (+e.amount || 0), 0);
    const pendingDebts = data.debts.filter(d => {
      if (!d.dueDay) return false;
      const dd = +d.dueDay;
      if (isQ1 ? !(dd <= 15 && dd > day) : !(dd >= 16 && dd > day)) return false;
      return !(d.monthlyPayments || []).some(p => p.month === curMonth);
    }).reduce((s, d) => {
      const pay = d.type === 'plan' ? +(d.paymentAmount || 0) : d.type === 'informal' && d.informalMode === 'fixed' ? +(d.paymentAmount || 0) : +(d.minPayment || d.monthlyPayment || 0);
      return s + pay;
    }, 0);
    realBalance = currentDebit + currentEfectivo - pendingFixed - pendingDebts;
  }
  return {
    income,
    isQ1,
    daysLeft,
    fixedQ,
    varH,
    debtQ,
    cardPayQ,
    cardReserved,
    cashSpentToday,
    committed,
    remaining,
    daily: remaining / daysLeft,
    hasSaldo,
    currentDebit,
    currentEfectivo,
    realBalance
  };
}

/* ── CASH FLOW FORECAST ── */
// Saldo real actual: lo que entró (saldo inicial + quincenas recibidas en la app)
// menos lo que se gastó (transacciones registradas). Compartido por cash flow y planeación.
function getActualBalance(data) {
  const saldoBase = (parseFloat(data.saldoDebito) || 0) + (parseFloat(data.saldoEfectivo) || 0);
  const paydaysTotal = (data.paydays || []).reduce((s, p) => s + (+p.amount || 0), 0);
  const cashTotal = (data.cashTransactions || []).reduce((s, t) => s + (+t.amount || 0), 0);
  return Math.max(0, saldoBase + paydaysTotal - cashTotal);
}
// Quincenas de este mes que aún no han llegado (no auto-detectadas en paydays)
function getPendingPaydays(data) {
  const today = new Date();
  const todayDay = today.getDate();
  const curMonthKey = today.toISOString().slice(0, 7);
  const q1Full = parseFloat(data.q1) || 0;
  const q2Full = parseFloat(data.q2) || 0;
  const q1Received = (data.paydays || []).some(p => p.quincena === curMonthKey + '-Q1');
  const q2Received = (data.paydays || []).some(p => p.quincena === curMonthKey + '-Q2');
  const pendingQ2 = !q2Received && todayDay < 16 ? q2Full : 0;
  const pendingQ1 = !q1Received && todayDay < 1 ? q1Full : 0;
  return pendingQ1 + pendingQ2;
}
function getCashFlow(data) {
  const today = new Date();
  const q1Full = parseFloat(data.q1) || 0;
  const q2Full = parseFloat(data.q2) || 0;
  const actualBalance = getActualBalance(data);
  const pendingPaydays = getPendingPaydays(data);
  const months = [];
  for (let i = 0; i < 3; i++) {
    const m = new Date(today.getFullYear(), today.getMonth() + i, 1);
    const monthName = m.toLocaleDateString('es-MX', {
      month: 'long'
    });

    // Este mes: ingreso real (saldo + lo que falta de entrar)
    // Meses futuros: ingreso esperado completo Q1+Q2
    const income = i === 0 ? actualBalance + pendingPaydays : q1Full + q2Full;
    const fixed = data.exps.reduce((s, e) => s + (+e.amount || 0), 0);
    const vars = data.varExps.reduce((s, e) => s + (+e.amount || 0), 0);
    const debts = data.debts.reduce((s, d) => {
      if (d.type === 'tarjeta') return s + (+d.minPayment || 0);
      if (d.type === 'prestamo') return s + (+d.monthlyPayment || 0);
      if (d.type === 'plan') {
        const info = getPlanInfo(d);
        return info.remaining > i ? s + info.amount : s;
      }
      if (d.type === 'informal' || d.type === 'deadline') {
        const urg = calcUrgency(d);
        return urg.daysLeft != null && urg.daysLeft <= 45 && i === 0 ? s + (+d.balance || 0) : s;
      }
      return s;
    }, 0);
    const totalOut = fixed + vars + debts;
    const net = income - totalOut;
    const status = net > 3000 ? 'good' : net > 500 ? 'ok' : net > -1000 ? 'warn' : 'danger';
    months.push({
      name: monthName,
      income,
      out: totalOut,
      net,
      status,
      isCurrent: i === 0
    });
  }
  return months;
}
// Cuánto sobra cada mes "normal" (ingreso completo Q1+Q2+extras menos compromisos recurrentes)
function getMonthlySurplus(data) {
  const q1 = parseFloat(data.q1) || 0;
  const q2 = parseFloat(data.q2) || 0;
  const extraMonthly = (data.extraIncome || []).reduce((s, e) => e.type === 'monthly' ? s + (+e.amount || 0) : s, 0);
